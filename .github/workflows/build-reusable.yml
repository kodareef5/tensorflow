name: Reusable Build
on:
  workflow_call:
    inputs:
      runner:
        description: 'Which runner should the workflow run on?'
        required: true
        type: string
      tfci:
        description: 'TFCI environment variable'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-and-test:
    if: contains(github.event.pull_request.body, 'WIP')
    runs-on: ${{ inputs.runner }}
    defaults:
      run:
        shell: bash
    container: ${{ (contains(inputs.runner, 'linux-x86') && 'us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest') ||
                   (contains(inputs.runner, 'linux-arm64') && 'us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build-arm64:latest') ||
                   (contains(inputs.runner, 'windows-x86') && null) }}
    timeout-minutes: 300
    steps:

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # ratchet:actions/checkout@v4
        env:
          GIT_CONFIG_PARAMETERS: "'checkout.workers=12' 'core.featureManyFiles=true'"
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
        
      - name: "Setup Clang and MSVC environment"
        if: contains(inputs.runner, 'windows-x86')
        # JAX handles Clang on Windows by relying on standard paths and environment variables.
        # We find the local installation of MSVC and LLVM and set the necessary environment variables
        # for Bazel's discovery mechanism (cc_configure).
        env:
          TFCI: ${{ inputs.tfci }}
        run: |
          $ErrorActionPreference = "Stop"
          
          $VS_PATH = & "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          if ($LASTEXITCODE -ne 0) { throw "vswhere failed with exit code $LASTEXITCODE" }
          $VS_PATH = $VS_PATH.Replace('\', '/')
          $VS_VC_DIR = "$VS_PATH/VC"
          
          $MSVC_DIR = Get-ChildItem -Directory -Path "$VS_VC_DIR/Tools/MSVC" -ErrorAction SilentlyContinue | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $MSVC_DIR) { throw "Could not find MSVC directory in $VS_VC_DIR/Tools/MSVC" }
          $MSVC_VERSION = $MSVC_DIR.Name

          # Find the root of LLVM installation that contains bin\clang-cl.exe
          # 1. Search in Visual Studio's bundled LLVM
          # 2. Search in common standalone installation paths
          # 3. Use 'where.exe' to find it in PATH
          $SEARCH_PATHS = @(
            "$VS_PATH\VC\Tools\Llvm",
            "C:\Program Files\LLVM",
            "C:\Program Files (x86)\LLVM",
            "C:\tools\LLVM"
          )
          
          $CLANG_CL_EXE = $null
          foreach ($SEARCH_PATH in $SEARCH_PATHS) {
            if (Test-Path $SEARCH_PATH) {
              Write-Output "Searching for clang-cl.exe in $SEARCH_PATH..."
              $CLANG_CL_EXE = Get-ChildItem -Path $SEARCH_PATH -Recurse -Filter "clang-cl.exe" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -notmatch "ARM64" } | Sort-Object FullName -Descending | Select-Object -First 1
              if ($CLANG_CL_EXE) { break }
            }
          }
          
          if (-Not $CLANG_CL_EXE) {
            Write-Output "Not found in common paths, searching system PATH..."
            $WHERE_CLANG = where.exe clang-cl 2>$null | Select-Object -First 1
            if ($WHERE_CLANG) {
               $CLANG_CL_EXE = Get-Item $WHERE_CLANG
            }
          }

          if (-Not $CLANG_CL_EXE) {
            throw "ERROR: clang-cl.exe not found in any of: $SEARCH_PATHS or in PATH!"
          }

          $CLANG_CL_PATH = $CLANG_CL_EXE.FullName.Replace('\', '/')
          $VS_LLVM_DIR = (Split-Path (Split-Path $CLANG_CL_PATH -Parent) -Parent).Replace('\', '/')
          $VS_VC_DIR = $VS_VC_DIR.Replace('\', '/')

          $BAZEL_SH = "C:/tools/msys64/usr/bin/bash.exe"
          if (-not (Test-Path $BAZEL_SH)) { $BAZEL_SH = "C:/Program Files/Git/bin/bash.exe" }

          # We export both prefixed and non-prefixed versions to ensure they survive 
          # the various CI script sourcing stages. We use backslashes for BAZEL_VC 
          # and BAZEL_LLVM to ensure compatibility with Bazel's detection logic.
          $VS_VC_DIR_NATIVE = $VS_VC_DIR.Replace('/', '\')
          $VS_LLVM_DIR_NATIVE = $VS_LLVM_DIR.Replace('/', '\')

          Write-Output "Found MSVC: $VS_VC_DIR (version $MSVC_VERSION)"
          Write-Output "Found LLVM: $VS_LLVM_DIR"
          Write-Output "Found BAZEL_SH: $BAZEL_SH"

          # Diagnostic: Check for the "fixed" MSVC version that RBE toolchain expects
          $FIXED_MSVC_VERSION = "14.42.34433"
          if (Test-Path "$VS_VC_DIR/Tools/MSVC/$FIXED_MSVC_VERSION") {
            Write-Output "Diagnostic: Fixed MSVC version $FIXED_MSVC_VERSION found on host."
          } else {
            Write-Output "Diagnostic: Fixed MSVC version $FIXED_MSVC_VERSION NOT found on host."
            Write-Output "Available versions in $VS_VC_DIR/Tools/MSVC:"
            Get-ChildItem -Path "$VS_VC_DIR/Tools/MSVC" | Select-Object -ExpandProperty Name
          }

          # Write robust config to .bazelrc.user.
          # We use forward slashes (/) here because Bazel's .bazelrc parser treats 
          # backslashes (\) as escape characters inside double quotes.
          $bazelrc_user = ".bazelrc.user"
          $config_lines = @()
          
          if ($env:TFCI -like "*rbe*") {
            # Global safety flags to ensure no local leakage
            $config_lines += "common --repo_env=BAZEL_DO_NOT_DETECT_CPP_TOOLCHAIN=1"
            $config_lines += "common --incompatible_enable_cc_toolchain_resolution"
            $config_lines += "common --repo_env=BAZEL_VC=C:/RBE_ISOLATED_INVALID_PATH"
            $config_lines += "common --repo_env=BAZEL_LLVM=C:/RBE_ISOLATED_INVALID_PATH"
            $config_lines += "common --repo_env=USE_CLANG_CL=0"
            $config_lines += "common --repo_env=HERMETIC_PYTHON_VERSION=3.13"
            
            # Neutralize base configs that cause host leakage
            $config_lines += "common:windows_x86_cpu_2022 --config=rbe_windows_x86_cpu_2022"
            $config_lines += "common:clang_local --incompatible_enable_cc_toolchain_resolution"
            $config_lines += "common:clang_local --repo_env=USE_HERMETIC_CC_TOOLCHAIN=1"

            # High-priority overrides for RBE. We target the specific config used by pycpp.sh
            $target_config = "windows_x86_cpu_2022_pycpp_test"
            $config_lines += "test:$target_config --config=rbe_windows_x86_cpu_2022"
            $config_lines += "test:$target_config --spawn_strategy=remote"
            $config_lines += "test:$target_config --extra_execution_platforms=//tensorflow/tools/toolchains/win2022:windows_ltsc2022_clang_new"
            $config_lines += "test:$target_config --host_platform=//tensorflow/tools/toolchains/win2022:windows_ltsc2022_clang_new"
            $config_lines += "test:$target_config --platforms=//tensorflow/tools/toolchains/win2022:windows_ltsc2022_clang_new"
            $config_lines += "test:$target_config --extra_toolchains=@org_tensorflow//tensorflow/tools/toolchains/win2022/20241118:cc-toolchain-x64_windows-clang-cl"

            # Global remote execution enforcement
            $config_lines += "build --spawn_strategy=remote"
            $config_lines += "build --strategy=CppCompile=remote"
            $config_lines += "build --strategy=CppLink=remote"
            $config_lines += "build --strategy=TestRunner=remote"
          } else {
            # Local Build configuration
            $config_lines += "build --repo_env=BAZEL_LLVM=""$VS_LLVM_DIR"""
            $config_lines += "build --repo_env=BAZEL_VC=""$VS_VC_DIR"""
            $config_lines += "build --repo_env=BAZEL_VC_FULL_VERSION=""$MSVC_VERSION"""
            $config_lines += "build --repo_env=BAZEL_SH=""$BAZEL_SH"""
            $config_lines += "build --repo_env=USE_CLANG_CL=1"
            $config_lines += "build --repo_env=BAZEL_DO_NOT_DETECT_CPP_TOOLCHAIN=0"
          }
          [System.IO.File]::WriteAllText("$pwd\$bazelrc_user", ($config_lines -join "`r`n") + "`r`n")

          # Set variables in GITHUB_ENV. We export both prefixed and non-prefixed versions
          # to ensure they survive the various CI script sourcing stages.
          $env_vars = @(
            "BAZEL_LLVM=$VS_LLVM_DIR_NATIVE",
            "BAZEL_SH=$BAZEL_SH",
            "TFCI_BAZEL_LLVM=$VS_LLVM_DIR_NATIVE",
            "TFCI_USE_CLANG_CL=1"
          )
          
          if ($env:TFCI -like "*rbe*") {
            # For RBE, we explicitly set invalid paths to BAZEL_VC and BAZEL_LLVM 
            # to force the auto-configuration to fail.
            $poison_path = "C:/RBE_ISOLATED_INVALID_PATH"
            $env_vars += "BAZEL_VC=$poison_path"
            $env_vars += "BAZEL_LLVM=$poison_path"
            $env_vars += "INCLUDE="
            $env_vars += "LIB="
            $env_vars += "USE_CLANG_CL=0"
            $env_vars += "TFCI_BAZEL_VC=$poison_path"
            $env_vars += "TFCI_BAZEL_LLVM=$poison_path"
            $env_vars += "TFCI_BAZEL_SH=$BAZEL_SH"
            $env_vars += "TFCI_USE_CLANG_CL=0"

            # Construct clean RBE flags.
            $rbe_args = "--config=rbe_windows_x86_cpu_2022"
            $rbe_args += " --repo_env=HERMETIC_PYTHON_VERSION=3.13"
            $rbe_args += " --repo_env=BAZEL_DO_NOT_DETECT_CPP_TOOLCHAIN=1"
            $env_vars += "TFCI_BAZEL_COMMON_ARGS=$rbe_args"
          } else {
            $env_vars += "BAZEL_VC=$VS_VC_DIR_NATIVE"
            $env_vars += "BAZEL_VC_FULL_VERSION=$MSVC_VERSION"
            $env_vars += "BAZEL_LLVM=$VS_LLVM_DIR_NATIVE"
            $env_vars += "BAZEL_DO_NOT_DETECT_CPP_TOOLCHAIN=0"
            $env_vars += "TFCI_BAZEL_VC=$VS_VC_DIR_NATIVE"
            $env_vars += "TFCI_BAZEL_VC_FULL_VERSION=$MSVC_VERSION"
            $env_vars += "TFCI_BAZEL_LLVM=$VS_LLVM_DIR_NATIVE"
            $env_vars += "TFCI_BAZEL_DO_NOT_DETECT_CPP_TOOLCHAIN=0"
            $env_vars += "TFCI_USE_CLANG_CL=1"
          }
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, ($env_vars -join "`r`n") + "`r`n")
          [System.IO.File]::AppendAllText($env:GITHUB_PATH, "$VS_LLVM_DIR_NATIVE\bin`r`n")

          Write-Output "Environment configured in $bazelrc_user, GITHUB_ENV, and GITHUB_PATH"
          Get-Content $bazelrc_user

          # Diagnostic: Check for Windows SDK and MSVC headers
          Write-Output "Checking for Windows SDK and MSVC headers..."
          $sdk_include_root = "C:/Program Files (x86)/Windows Kits/10/Include"
          if (Test-Path $sdk_include_root) {
            Get-ChildItem -Path $sdk_include_root | Select-Object -First 5
          } else {
            Write-Output "WARNING: Windows SDK include root not found at $sdk_include_root"
          }

          $msvc_include_path = "$VS_VC_DIR/Tools/MSVC/$MSVC_VERSION/include"
          Write-Output "Checking MSVC include path: $msvc_include_path"
          if (Test-Path $msvc_include_path) {
            $critical_headers = @("vcruntime.h", "type_traits", "algorithm", "cstdint")
            foreach ($header in $critical_headers) {
              if (Test-Path "$msvc_include_path/$header") {
                Write-Output "  Found $header"
              } else {
                Write-Output "  MISSING: $header"
              }
            }
          } else {
            Write-Output "ERROR: MSVC include path NOT found: $msvc_include_path"
          }
          
          Write-Output "Checking for LLVM internal headers..."
          if (Test-Path "$VS_LLVM_DIR/lib/clang") {
            Get-ChildItem -Path "$VS_LLVM_DIR/lib/clang" | Select-Object -ExpandProperty Name
          } else {
            Write-Output "WARNING: LLVM internal headers not found in $VS_LLVM_DIR/lib/clang"
          }

          # Explicitly set exit code to 0 to avoid "ghost" failures from previous non-terminating errors
          $global:LASTEXITCODE = 0
        shell: powershell

      - name: Build and test
        env:
          TFCI: ${{ inputs.tfci }}
          TFCI_GITHUB_ACTIONS: true
        run: ./ci/official/pycpp.sh
